name: Fix PROCONDIF PCD cleanroom image

on:
  push:
    paths:
      - '.github/workflows/fix-procondif-pcd-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check requests pillow beautifulsoup4
      - name: Download and validate high-resolution cleanroom photograph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import io, re
          import requests
          from PIL import Image, ImageStat

          page_url='https://unsplash.com/photos/workers-in-protective-suits-inside-a-sterile-laboratory-9gZO2N6leRI'
          image_url='https://images.unsplash.com/photo-1748002388689-c62b45d5c28b?auto=format&fit=crop&fm=jpg&q=85&w=2400'
          out=Path('assets/images/context/procondif-cleanroom.jpg')
          out.parent.mkdir(parents=True,exist_ok=True)

          r=requests.get(image_url,headers={'User-Agent':'Mozilla/5.0'},timeout=90)
          r.raise_for_status()
          data=r.content
          if len(data)<150_000:
              raise SystemExit(f'Cleanroom image unexpectedly small: {len(data)} bytes')

          im=Image.open(io.BytesIO(data)).convert('RGB')
          w,h=im.size
          if w<1600 or h<900:
              raise SystemExit(f'Cleanroom image resolution too low: {w}x{h}')
          if not (1.25 <= w/h <= 2.0):
              raise SystemExit(f'Unexpected cleanroom image aspect ratio: {w}x{h}')

          # Detect the specific class of corruption seen previously: a large flat pink/magenta stripe.
          probe=im.resize((240,160))
          px=list(probe.getdata())
          pink=sum(1 for rr,gg,bb in px if rr>190 and bb>170 and gg<175)
          if pink/len(px)>0.08:
              raise SystemExit(f'Image rejected: suspicious pink/magenta area {pink/len(px):.1%}')

          # Ensure the file has photographic detail rather than a flat placeholder.
          variance=sum(ImageStat.Stat(probe).var)/3
          if variance<250:
              raise SystemExit(f'Image rejected: insufficient photographic detail, variance={variance:.1f}')

          im.save(out,'JPEG',quality=88,optimize=True,progressive=True)
          check=Image.open(out)
          check.verify()
          check=Image.open(out)
          cw,ch=check.size
          print('validated',out,cw,ch,out.stat().st_size,'bytes','variance',round(variance,1))

          # Update both placements. Use a local file so there are no runtime hotlinks.
          pages=['trox-healthcare-operating-rooms.html','trox-procondif-pcd.html']
          target_alt='TROX PROCONDIF PCD'
          tag=(f'<img src="{out.as_posix()}" alt="{target_alt}" loading="lazy" decoding="async" '
               f'width="{cw}" height="{ch}" class="trox-official-media" style="--trox-media-max:440px;">')
          for filename in pages:
              p=Path(filename)
              text=p.read_text(encoding='utf-8')
              pat=re.compile(r'<img\b[^>]*alt=["\']'+re.escape(target_alt)+r'["\'][^>]*>',re.I)
              text,n=pat.subn(tag,text,count=1)
              if n!=1:
                  raise SystemExit(f'{filename}: PROCONDIF image tag not found')
              p.write_text(text,encoding='utf-8')

          # Preserve source/license provenance for future production migration.
          source=Path('assets/images/context/PROCONDIF-CLEANROOM-SOURCE.txt')
          source.write_text(
              'PROCONDIF PCD contextual cleanroom photograph\n'
              'Source page: '+page_url+'\n'
              'Photographer/source: TECNIC Bioprocess Solutions\n'
              'Published: 2025-05-23\n'
              'License: Unsplash License (free to use)\n'
              'Downloaded and localized in the repository; no runtime hotlink.\n',
              encoding='utf-8')

          # Remove the superseded soft/corrupted local PROCONDIF image if it is no longer referenced.
          old=Path('assets/images/trox-official/procondif-pcd.jpg')
          joined=''.join(Path(f).read_text(encoding='utf-8') for f in pages)
          if old.exists() and old.as_posix() not in joined:
              old.unlink()
          PY
      - name: Commit cleanroom image replacement
        shell: bash
        run: |
          set -euo pipefail
          git add -A assets/images/context assets/images/trox-official/procondif-pcd.jpg trox-healthcare-operating-rooms.html trox-procondif-pcd.html
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use high-resolution cleanroom image for PROCONDIF PCD'
          git push
