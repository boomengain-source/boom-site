name: Fix PROCONDIF PCD official product image

on:
  push:
    paths:
      - '.github/workflows/fix-procondif-pcd-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install PDF/image tools
        run: python -m pip install --disable-pip-version-check requests pymupdf pillow
      - name: Extract a high-resolution official TROX PROCONDIF image and update pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, re
          from pathlib import Path
          import requests, pymupdf
          from PIL import Image, ImageStat

          sources=[
            ('product-info','https://www.trox.de/en/downloads/3d599bf0d121fee4/L04119e.pdf?type=product_info'),
            ('reference-photos','https://cdn.trox.de/public/427268ba9f228812/ba0b5d2e2401178ee8d204985a43f69c/procondif-typ-pcd-referenzfotos.pdf'),
          ]
          session=requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          candidates=[]
          for source_index,(source_name,url) in enumerate(sources):
            r=session.get(url,timeout=90); r.raise_for_status()
            doc=pymupdf.open(stream=r.content,filetype='pdf')
            for page_no in range(min(6,len(doc))):
              for item in doc[page_no].get_images(full=True):
                xref=item[0]
                try:
                  info=doc.extract_image(xref); data=info['image']; ext=info.get('ext','').lower()
                  im=Image.open(io.BytesIO(data)).convert('RGB'); w,h=im.size; ratio=w/max(h,1)
                  if w<500 or h<260 or ratio<0.45 or ratio>3.5: continue
                  variance=sum(ImageStat.Stat(im.resize((96,96))).var)/3
                  if variance<80: continue
                  photographic=ext in ('jpeg','jpg','jpx')
                  # Prefer images from the product information, early pages, photographic rasters and useful landscape/square composition.
                  source_bonus=8_000_000 if source_index==0 else 3_000_000
                  page_bonus=max(0,5-page_no)*600_000
                  photo_bonus=5_000_000 if photographic else 0
                  composition_bonus=800_000 if 0.7<=ratio<=2.2 else 0
                  score=source_bonus+page_bonus+photo_bonus+composition_bonus+w*h+min(variance,6000)*150
                  candidates.append((score,source_name,url,page_no,w,h,variance,ext,data,photographic))
                  print('candidate',source_name,'page',page_no+1,f'{w}x{h}','var',round(variance,1),'ext',ext,'photo',photographic,'score',round(score,1))
                except Exception as e:
                  print('skip',source_name,page_no+1,xref,e)

          if not candidates:
            raise SystemExit('No high-resolution PROCONDIF image found in official TROX PDFs')
          photos=[c for c in candidates if c[-1]]
          pool=photos or candidates
          pool.sort(key=lambda x:x[0],reverse=True)
          score,source_name,url,page_no,w,h,variance,ext,data,photographic=pool[0]
          ext='jpg' if ext in ('jpeg','jpg','jpx') else 'png'
          out=Path('assets/images/trox-official')/f'procondif-pcd.{ext}'
          for stale in Path('assets/images/trox-official').glob('procondif-pcd.*'):
            stale.unlink()
          out.write_bytes(data)
          check=Image.open(out); cw,ch=check.size
          if cw<500 or ch<260 or out.stat().st_size<5000:
            raise SystemExit(f'Extracted PROCONDIF image failed validation: {cw}x{ch}, {out.stat().st_size} bytes')
          print('SELECTED',source_name,'page',page_no+1,f'{cw}x{ch}',check.format,out.stat().st_size,'bytes','=>',out)

          pages=['trox-healthcare-operating-rooms.html','trox-procondif-pcd.html']
          target_alt='TROX PROCONDIF PCD'
          for filename in pages:
            p=Path(filename); text=p.read_text(encoding='utf-8')
            # Replace the image carrying this product alt, irrespective of old host/transformation URL.
            pat=re.compile(r'<img\b[^>]*alt=["\']'+re.escape(target_alt)+r'["\'][^>]*>',re.I)
            tag=f'<img src="{out}" alt="{target_alt}" loading="lazy" decoding="async" width="{cw}" height="{ch}" class="trox-official-media" style="--trox-media-max:{min(420,int(cw/1.25))}px;">'
            text,n=pat.subn(tag,text,count=1)
            if n!=1:
              raise SystemExit(f'{filename}: PROCONDIF image tag not found')
            text=text.replace('src="https://boom-eng.ru/wp-content/themes/boom-theme/assets/images/logo.png"','src="assets/images/boom-engineering-logo.svg"')
            p.write_text(text,encoding='utf-8')

          css=Path('styles.css'); ct=css.read_text(encoding='utf-8')
          marker='/* TROX_OFFICIAL_MEDIA_GUARD */'
          if marker not in ct:
            ct+='\n/* TROX_OFFICIAL_MEDIA_GUARD */\nimg.trox-official-media{display:block!important;width:auto!important;height:auto!important;max-width:min(var(--trox-media-max,480px),100%)!important;max-height:360px!important;object-fit:contain!important;margin-left:auto;margin-right:auto}\n'
            css.write_text(ct,encoding='utf-8')

          # Acceptance gates.
          for filename in pages:
            text=Path(filename).read_text(encoding='utf-8')
            if str(out) not in text: raise SystemExit(filename+': local PROCONDIF asset missing after update')
            if '3011340_procondif_q_240' in text: raise SystemExit(filename+': low-resolution legacy PROCONDIF source remains')
          PY
      - name: Commit PROCONDIF fix
        shell: bash
        run: |
          set -euo pipefail
          git add -A assets/images/trox-official/procondif-pcd.* trox-healthcare-operating-rooms.html trox-procondif-pcd.html styles.css
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use high-resolution official PROCONDIF PCD image'
          git push
