name: Localize remaining TROX catalogue images

on:
  push:
    paths:
      - '.github/workflows/localize-remaining-trox-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download, validate and localize remaining external images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import html
          import io
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from PIL import Image

          pages=sorted(Path('.').glob('trox-*.html'))
          outdir=Path('assets/images/trox-official/catalog'); outdir.mkdir(parents=True,exist_ok=True)
          session=requests.Session(); session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://www.trox.de/'})
          cache={}
          localized=[]

          def slugify(s):
              s=(s or 'trox-product').strip().lower()
              s=re.sub(r'^trox\s+','',s,flags=re.I)
              s=re.split(r'\s+[—–-]\s+',s,1)[0]
              s=re.sub(r'[^a-z0-9а-яё]+','-',s,flags=re.I).strip('-')
              # filenames stay ASCII-ish where possible; non-ascii model names are uncommon
              s=re.sub(r'[^a-z0-9-]+','',s)
              return s[:60] or 'trox-product'

          def attrs(tag):
              return {m.group(1).lower():m.group(3) for m in re.finditer(r'([:\w-]+)\s*=\s*(["\'])(.*?)\2',tag,re.S)}

          def replace_attr(tag,name,value):
              pat=re.compile(r'(\b'+re.escape(name)+r'\s*=\s*)(["\']).*?\2',re.I|re.S)
              if pat.search(tag):
                  return pat.sub(lambda m:m.group(1)+'"'+value+'"',tag,count=1)
              return tag[:-1]+f' {name}="{value}">'

          def add_class(tag,name):
              a=attrs(tag); current=a.get('class','').split()
              if name not in current: current.append(name)
              return replace_attr(tag,'class',' '.join(current))

          def merge_style(tag,addition):
              a=attrs(tag); cur=a.get('style','').strip()
              if cur and not cur.endswith(';'): cur+=';'
              return replace_attr(tag,'style',cur+addition)

          def download(url,alt):
              url=html.unescape(url)
              if url in cache: return cache[url]
              r=session.get(url,timeout=60); r.raise_for_status()
              if len(r.content)<7000: raise RuntimeError(f'suspiciously small response ({len(r.content)} bytes)')
              im=Image.open(io.BytesIO(r.content)); im.load(); w,h=im.size; fmt=(im.format or '').upper()
              if w<400 or h<220:
                  raise RuntimeError(f'official raster too small: {w}x{h}')
              ratio=w/max(h,1)
              if ratio>6 or ratio<0.3:
                  raise RuntimeError(f'implausible product aspect ratio: {w}x{h}')
              ext={'JPEG':'jpg','PNG':'png','WEBP':'webp','GIF':'gif'}.get(fmt)
              if not ext: raise RuntimeError(f'unsupported image format: {fmt}')
              digest=hashlib.sha256(url.encode()).hexdigest()[:10]
              filename=f'{slugify(alt)}-{digest}.{ext}'
              path=outdir/filename
              path.write_bytes(r.content)
              # Reopen the exact written bytes as a corruption gate.
              check=Image.open(path); cw,ch=check.size
              if (cw,ch)!=(w,h): raise RuntimeError('written image dimension mismatch')
              # Do not render above 80% of source width: minimum 1.25 source-density gate.
              max_display=max(220,min(480,int(w/1.25)))
              cache[url]=(str(path),w,h,max_display,len(r.content))
              return cache[url]

          external_re=re.compile(r'<img\b[^>]*\bsrc=["\'](?:https?:)?//[^>]*>',re.I|re.S)
          for page in pages:
              text=page.read_text(encoding='utf-8',errors='strict')
              def repl(m):
                  tag=m.group(0); a=attrs(tag); src=a.get('src',''); alt=a.get('alt','')
                  absolute=html.unescape(src)
                  host=urlparse(absolute if absolute.startswith('http') else 'https:'+absolute).netloc.lower()
                  # BOOM logos must use the checked-in canonical SVG, never production hotlinks.
                  if 'boom-eng.ru' in host and ('logo' in absolute.lower() or 'boom engineering' in alt.lower()):
                      new=replace_attr(tag,'src','assets/images/boom-engineering-logo.svg')
                      new=replace_attr(new,'width','197'); new=replace_attr(new,'height','63')
                      return new
                  allowed=('trox.de' in host or 'scrvt.com' in host or '/trox/' in absolute.lower())
                  if not allowed:
                      raise RuntimeError(f'{page}: external non-TROX image is forbidden: {absolute}')
                  try:
                      local,w,h,max_display,byte_count=download(absolute,alt)
                  except Exception as e:
                      raise RuntimeError(f'{page}: cannot localize {absolute}: {e}')
                  new=replace_attr(tag,'src',local)
                  new=replace_attr(new,'width',str(w)); new=replace_attr(new,'height',str(h))
                  new=add_class(new,'trox-official-media')
                  new=merge_style(new,f'--trox-media-max:{max_display}px;')
                  localized.append((str(page),alt,absolute,local,w,h,max_display,byte_count))
                  return new
              text=external_re.sub(repl,text)
              page.write_text(text,encoding='utf-8')

          # One global rule overrides older width:100% card rules without enlarging any raster.
          css=Path('styles.css'); ct=css.read_text(encoding='utf-8')
          marker='/* TROX_OFFICIAL_MEDIA_GUARD */'
          rule='''\n/* TROX_OFFICIAL_MEDIA_GUARD */\nimg.trox-official-media{display:block!important;width:auto!important;height:auto!important;max-width:min(var(--trox-media-max,480px),100%)!important;max-height:360px!important;object-fit:contain!important;margin-left:auto;margin-right:auto}\n'''
          if marker not in ct: ct+=rule
          css.write_text(ct,encoding='utf-8')

          # Repository-level acceptance: no external IMG remains on TROX pages.
          leftovers=[]
          for page in pages:
              t=page.read_text(encoding='utf-8')
              if external_re.search(t): leftovers.append(str(page))
          if leftovers: raise SystemExit('External img tags remain: '+', '.join(leftovers))

          print('LOCALIZED UNIQUE URLS:',len(cache))
          print('REPLACEMENTS:',len(localized))
          for page,alt,src,local,w,h,maxd,b in localized:
              print(f'{page} | {alt} | {w}x{h} | display<={maxd}px | {b} bytes | {local}')
          print('Repository external-image gate: PASS')
          PY
      - name: Commit localization
        shell: bash
        run: |
          set -euo pipefail
          git add -A assets/images/trox-official/catalog trox-*.html styles.css
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize remaining TROX catalogue images'
          git push
