name: Sync official TROX X-CUBE product images

on:
  push:
    paths:
      - '.github/workflows/sync-xcube-product-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate official TROX X-CUBE images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/trox-official
          python - <<'PY'
          import io
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          HEADERS = {'User-Agent': UA, 'Referer': 'https://www.trox.de/'}

          products = [
              ('x-cube', 'X-CUBE', 'https://www.trox.de/en/central-air-handling-units/x-cube-ec73b2b95937ad0a?format=html&slug=central-air-handling-units%2Fx-cube'),
              ('x-cube-x2', 'X-CUBE X2', 'https://www.trox.de/en/central-air-handling-units/x-cube-x2-73ce35a32fb100ea'),
              ('x-cube-x2-compact', 'X-CUBE X2 compact', 'https://www.trox.de/en/central-air-handling-units/x-cube-x2-compact-abef5413063f053f'),
              ('x-cube-crofcu', 'X-CUBE CROFCU', 'https://www.trox.de/raumlufttechnische-geraete/x-cube-crofcu-4c9509c35c87a213'),
          ]

          def norm(s):
              return re.sub(r'[^a-z0-9]+', '', (s or '').lower())

          def candidate_urls(page_url, html, label):
              soup = BeautifulSoup(html, 'html.parser')
              rows = []
              og = soup.find('meta', attrs={'property':'og:image'})
              if og and og.get('content'):
                  rows.append((urljoin(page_url, og['content']), 'og:image', ''))
              tw = soup.find('meta', attrs={'name':'twitter:image'})
              if tw and tw.get('content'):
                  rows.append((urljoin(page_url, tw['content']), 'twitter:image', ''))
              for img in soup.find_all('img'):
                  alt = ' '.join(filter(None, [img.get('alt'), img.get('title')]))
                  for attr in ('src','data-src','data-lazy-src','data-original'):
                      val = img.get(attr)
                      if val:
                          rows.append((urljoin(page_url, val), attr, alt))
                  for attr in ('srcset','data-srcset'):
                      val = img.get(attr)
                      if val:
                          for part in val.split(','):
                              u = part.strip().split(' ')[0]
                              if u:
                                  rows.append((urljoin(page_url, u), attr, alt))
              # unique, preserve order
              seen = set(); out = []
              for r in rows:
                  if r[0] not in seen:
                      seen.add(r[0]); out.append(r)
              return out

          def score(url, source, alt, label):
              text = f'{url} {alt}'.lower()
              s = 0
              label_n = norm(label)
              text_n = norm(text)
              if label_n and label_n in text_n:
                  s += 180
              for token in norm(label).replace('compact',' compact ').split():
                  if token and token in text_n:
                      s += 15
              if 'x-cube' in text or 'xcube' in text_n:
                  s += 90
              if 'crofcu' in text_n:
                  s += 70 if 'crofcu' in label_n else -20
              if 'compact' in text_n:
                  s += 70 if 'compact' in label_n else -15
              if 'x2' in text_n:
                  s += 45 if 'x2' in label_n else -10
              if 'cdn.trox.de' in url or 'trox.de/__scrivito' in url:
                  s += 55
              if source in {'og:image','twitter:image'}:
                  s += 25
              if any(k in text_n for k in ('product','introduction','marketing','hero','image','img')):
                  s += 20
              if any(k in text_n for k in ('placeholder','logo','icon','sprite','flag','social','avatar','arrow','playbutton')):
                  s -= 250
              return s

          session = requests.Session()
          session.headers.update(HEADERS)

          for slug, label, page_url in products:
              print(f'\n=== {label} ===')
              page = session.get(page_url, timeout=45)
              page.raise_for_status()
              candidates = sorted(candidate_urls(page_url, page.text, label), key=lambda x: score(*x, label), reverse=True)
              valid = []
              for url, source, alt in candidates[:35]:
                  try:
                      r = session.get(url, timeout=45)
                      if r.status_code != 200 or len(r.content) < 12000:
                          continue
                      im = Image.open(io.BytesIO(r.content))
                      im.load()
                      w, h = im.size
                      if w < 600 or h < 260:
                          continue
                      # reject obvious banners/sprites and extremely narrow/wide assets
                      ratio = w / max(h, 1)
                      if ratio > 5.5 or ratio < 0.45:
                          continue
                      valid.append((score(url, source, alt, label), w*h, w, h, url, im.copy()))
                      print('candidate', score(url, source, alt, label), f'{w}x{h}', url)
                  except Exception as e:
                      continue
              if not valid:
                  raise SystemExit(f'No valid product image found for {label}')
              valid.sort(key=lambda x: (x[0], x[1]), reverse=True)
              sc, area, w, h, url, im = valid[0]
              # Keep transparent product renders where possible; normalize to PNG.
              if im.mode not in ('RGB','RGBA'):
                  im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              out = Path('assets/images/trox-official') / f'{slug}.png'
              im.save(out, format='PNG', optimize=True)
              print('SELECTED', label, f'{w}x{h}', url, '=>', out, out.stat().st_size)
              if out.stat().st_size < 15000:
                  raise SystemExit(f'{out}: suspiciously small output')
          PY

      - name: Commit downloaded images
        shell: bash
        run: |
          set -euo pipefail
          git add assets/images/trox-official
          if [ -z "$(git status --porcelain -- assets/images/trox-official)" ]; then
            echo 'No image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize official TROX X-CUBE product images'
          git push
