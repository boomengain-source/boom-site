name: Sync official TROX X-CUBE product images

on:
  push:
    paths:
      - '.github/workflows/sync-xcube-product-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate official TROX X-CUBE images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/trox-official
          python - <<'PY'
          import io
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          HEADERS = {'User-Agent': UA, 'Referer': 'https://www.trox.de/'}

          products = [
              {
                  'slug':'x-cube','label':'X-CUBE',
                  'page':'https://www.trox.de/en/central-air-handling-units/x-cube-ec73b2b95937ad0a?format=html&slug=central-air-handling-units%2Fx-cube',
                  'prefer':['x-cube_open','x-cube'], 'reject':['crofcu','compact']
              },
              {
                  'slug':'x-cube-x2','label':'X-CUBE X2',
                  'page':'https://www.trox.de/en/central-air-handling-units/x-cube-x2-73ce35a32fb100ea',
                  'prefer':['gif_01_x-cube','x2','x-cube'], 'reject':['crofcu','compact']
              },
              {
                  'slug':'x-cube-x2-compact','label':'X-CUBE X2 compact',
                  'page':'https://www.trox.de/en/central-air-handling-units/x-cube-x2-compact-abef5413063f053f',
                  'prefer':['compact','x2','x-cube'], 'reject':['crofcu']
              },
              {
                  'slug':'x-cube-crofcu','label':'X-CUBE CROFCU',
                  'page':'https://www.trox.de/raumlufttechnische-geraete/x-cube-crofcu-4c9509c35c87a213',
                  'prefer':['crofcu'], 'reject':['compact']
              },
          ]

          def norm(s):
              return re.sub(r'[^a-z0-9]+', '', (s or '').lower())

          def candidate_urls(page_url, html):
              soup = BeautifulSoup(html, 'html.parser')
              rows = []
              for attrs in ({'property':'og:image'}, {'name':'twitter:image'}):
                  m = soup.find('meta', attrs=attrs)
                  if m and m.get('content'):
                      rows.append((urljoin(page_url, m['content']), 'meta', ''))
              for img in soup.find_all('img'):
                  alt = ' '.join(filter(None, [img.get('alt'), img.get('title')]))
                  for attr in ('src','data-src','data-lazy-src','data-original'):
                      val = img.get(attr)
                      if val:
                          rows.append((urljoin(page_url, val), attr, alt))
                  for attr in ('srcset','data-srcset'):
                      val = img.get(attr)
                      if val:
                          for part in val.split(','):
                              u = part.strip().split(' ')[0]
                              if u:
                                  rows.append((urljoin(page_url, u), attr, alt))
              seen=set(); out=[]
              for row in rows:
                  if row[0] not in seen:
                      seen.add(row[0]); out.append(row)
              return out

          def score(url, source, alt, product):
              text = f'{url} {alt}'.lower()
              text_n = norm(text)
              s = 0
              for i, token in enumerate(product['prefer']):
                  if norm(token) in text_n:
                      s += 220 - i*45
              for token in product['reject']:
                  if norm(token) in text_n:
                      s -= 400
              if 'cdn.trox.de' in url or 'trox.de/__scrivito' in url:
                  s += 70
              if source == 'meta':
                  s += 25
              if any(k in text_n for k in ('product','introduction','marketing','hero','image','img')):
                  s += 20
              if any(k in text_n for k in ('placeholder','logo','icon','sprite','flag','social','avatar','arrow','playbutton')):
                  s -= 500
              return s

          session = requests.Session(); session.headers.update(HEADERS)
          manifest = {}

          for product in products:
              slug, label, page_url = product['slug'], product['label'], product['page']
              print(f'\n=== {label} ===')
              page = session.get(page_url, timeout=45); page.raise_for_status()
              rows = sorted(candidate_urls(page_url, page.text), key=lambda x: score(*x, product), reverse=True)
              valid=[]
              for url, source, alt in rows[:60]:
                  try:
                      r=session.get(url, timeout=45)
                      if r.status_code != 200 or len(r.content) < 8000:
                          continue
                      im=Image.open(io.BytesIO(r.content))
                      w,h=im.size
                      if w < 600 or h < 260:
                          continue
                      ratio=w/max(h,1)
                      if ratio > 5.5 or ratio < 0.45:
                          continue
                      sc=score(url,source,alt,product)
                      valid.append((sc,w*h,w,h,url,r.content,im.format))
                      print('candidate',sc,f'{w}x{h}',im.format,url)
                  except Exception:
                      continue
              if not valid:
                  raise SystemExit(f'No valid product image found for {label}')
              valid.sort(key=lambda x:(x[0],x[1]), reverse=True)
              sc,area,w,h,url,data,fmt=valid[0]
              ext={'JPEG':'jpg','PNG':'png','GIF':'gif','WEBP':'webp'}.get((fmt or '').upper())
              if not ext:
                  raise SystemExit(f'Unsupported format {fmt} for {label}')
              # remove stale variants for this slug so HTML can point to one canonical file
              for stale in Path('assets/images/trox-official').glob(f'{slug}.*'):
                  if stale.name != 'xcube-manifest.json':
                      stale.unlink()
              out=Path('assets/images/trox-official')/f'{slug}.{ext}'
              out.write_bytes(data)
              if out.stat().st_size < 8000:
                  raise SystemExit(f'{out}: suspiciously small ({out.stat().st_size} bytes)')
              manifest[slug]={'label':label,'file':str(out),'width':w,'height':h,'format':fmt,'source':url,'score':sc,'bytes':out.stat().st_size}
              print('SELECTED',label,f'{w}x{h}',fmt,url,'=>',out,out.stat().st_size)

          Path('assets/images/trox-official/xcube-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit downloaded images
        shell: bash
        run: |
          set -euo pipefail
          git add -A assets/images/trox-official
          if [ -z "$(git status --porcelain -- assets/images/trox-official)" ]; then
            echo 'No image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize official TROX X-CUBE product images'
          git push
